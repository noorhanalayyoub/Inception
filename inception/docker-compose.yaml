version: "3.7" #docker compose version
secrets:
  db_password:
    file: ./secrets/db_password.txt
  db_root_password:
    file: ./secrets/db_root_password.txt
  wp_admin_password:
    file: ./secrets/wp_admin_password.txt
  wp_user_password:
    file: ./secrets/wp_user_password.txt

services:
  nginx:
    build: ./src/requirements/nginx
    container_name: "nginx"
    ports:
      - "443:443"#port for https
    expose:
      - "9000"
    volumes:
    - /home/nalayyou/data/wordpress:/var/www/html
    networks:
      - inception
    env_file:
      - .env
    depends_on:
      - wordpress
    restart: always
  
  wordpress:
    build: ./src/requirements/wordpress
    container_name: "wordpress"
    volumes:
      - /home/nalayyou/data/wordpress:/var/www/html
    networks:
      - inception
    env_file:
      - .env
    secrets:
      - db_password
      - wp_admin_password
      - wp_user_password
    depends_on:
      mariadb:
        condition: service_healthy
    restart: always

  mariadb:
    build: ./src/requirements/mariadb
    container_name: "mariadb"
    volumes:
      - /home/nalayyou/data/mariadb:/var/lib/mysql
    networks:
      - inception
    env_file:
      - .env
    secrets:
      - db_password
      - db_root_password
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$(cat /run/secrets/db_root_password) || exit 1"]
    restart: always

networks:
  inception:
    driver: bridge #it is bridge by default , it can be mcvlan ipvlan and so on 
